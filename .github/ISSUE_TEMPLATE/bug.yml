name: Bug report
description: Report a reproducible LedgerStream defect
title: "bug: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal synthetic reproducer. Do not include real financial/customer data.
    validations:
      required: true
