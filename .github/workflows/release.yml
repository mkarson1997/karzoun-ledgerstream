name: Release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'pom.xml'
      - 'src/**'
  push:
    tags: ['v*']

permissions: {}

jobs:
  validate:
    name: Release validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build release artifacts
        run: mvn -B -ntp -DskipITs package
      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s target/ledgerstream-0.1.0.jar
          test -s target/ledgerstream-0.1.0-sources.jar
          test -s target/bom.json
          jar tf target/ledgerstream-0.1.0.jar >/dev/null

  publish:
    name: Publish GitHub Release and Maven package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Build release artifacts
        run: mvn -B -ntp -DskipITs package
      - name: Stage release artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp "target/ledgerstream-${VERSION}.jar" dist/
          cp "target/ledgerstream-${VERSION}-sources.jar" dist/
          cp target/bom.json "dist/ledgerstream-${VERSION}-sbom.json"
          (cd dist && sha256sum ledgerstream-* > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          if gh release view "$REF" >/dev/null 2>&1; then
            gh release upload "$REF" dist/* --clobber
          else
            gh release create "$REF" dist/* --verify-tag --title "Karzoun LedgerStream $REF" --generate-notes
          fi
      - name: Publish Maven package to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp -DskipTests -DskipITs deploy
