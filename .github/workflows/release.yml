name: Release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'pom.xml'
      - 'src/**'
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

jobs:
  validate:
    name: Release validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build release artifacts
        run: mvn -B -ntp -DskipITs package
      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s target/ledgerstream-0.1.0.jar
          test -s target/ledgerstream-0.1.0-sources.jar
          test -s target/bom.json
          jar tf target/ledgerstream-0.1.0.jar >/dev/null

  bootstrap-v0-1-0:
    name: Bootstrap v0.1.0 tag
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'prepare LedgerStream v0.1.0 release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create release tag exactly once
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already exists.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v0.1.0 -m 'Karzoun LedgerStream v0.1.0'
          git push origin v0.1.0

  publish:
    name: Publish GitHub Release and Maven package
    needs: [bootstrap-v0-1-0]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'prepare LedgerStream v0.1.0 release')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Build release artifacts
        run: mvn -B -ntp -DskipITs package
      - name: Stage release artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then VERSION='0.1.0'; fi
          mkdir -p dist
          cp "target/ledgerstream-${VERSION}.jar" dist/
          cp "target/ledgerstream-${VERSION}-sources.jar" dist/
          cp target/bom.json "dist/ledgerstream-${VERSION}-sbom.json"
          (cd dist && sha256sum ledgerstream-* > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then REF='v0.1.0'; fi
          if gh release view "$REF" >/dev/null 2>&1; then
            gh release upload "$REF" dist/* --clobber
          else
            gh release create "$REF" dist/* --verify-tag --title "Karzoun LedgerStream $REF" --generate-notes
          fi
      - name: Publish Maven package to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp -DskipTests -DskipITs deploy
