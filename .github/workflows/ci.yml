name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  verify:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Unit verification
        run: mvn -B -ntp verify

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: PostgreSQL/Testcontainers verification
        run: mvn -B -ntp -DskipITs=false verify

  ci-gate:
    name: CI Gate
    if: always()
    needs: [verify, postgres]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce required jobs
        if: needs.verify.result != 'success' || needs.postgres.result != 'success'
        run: exit 1
      - name: Confirm green build
        if: needs.verify.result == 'success' && needs.postgres.result == 'success'
        run: echo "LedgerStream CI is green."