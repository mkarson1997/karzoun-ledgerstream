name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  verify:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: mvn -B -ntp verify

  ci-gate:
    name: CI Gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce required jobs
        if: needs.verify.result != 'success'
        run: exit 1
      - name: Confirm green build
        if: needs.verify.result == 'success'
        run: echo "LedgerStream CI is green."
